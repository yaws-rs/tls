[package]
name = "blueprint-ytls"
version = "0.0.1"
edition = "2021"
description = "yaws TLS ytls blueprint"
homepage = "https://github.com/yaws-rs/tls"
keywords = ["io", "uring", "epoll", "async"]
license = "Apache-2.0/MIT"
readme = "README.md"
repository = "https://github.com/yaws-rs/tls"
categories = ["science"]

[dependencies]
blueprint = { version = "0.2" }
ytls-rustcrypto = { version = "0.0.3" }
ytls-traits = { version = "0.0.3", default-features = false }
ytls-server = { version = "0.0.9", default-features = false, optional = true }
ytls-typed = { version = "0.0.1", default-features = false }
pem-rfc7468 = { version = "0.7", default-features = false, optional = true }
pkcs8 = { version = "0.11", features = ["pem"] }
hex = "0.4.3"
heapless = { version = "0.9", default-features = false }
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }

[features]
default = ["server"]
server = ["dep:ytls-server"]
std = []
zeroize = ["ytls-server?/zeroize"]

[package.metadata.docs.rs]
features = []

